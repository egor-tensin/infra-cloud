firewall_ports4_tcp:
  # server-tensin-vpn-ru
  - port: 80
    source: '{{ wg_addr4 }}'
  # wg-api-web
  - port: 1234
    source: 192.168.177.1/24
  # Dante
  - port: '{{ dante_port }}'
    source: '{{ wg_addr4 }}'
firewall_ports_udp:
