- name: Maintenance
  hosts: all
  gather_facts: false

  roles:
    - tensin.infra.cloud_init_wait
    - tensin.infra.apt
    - tensin.infra.sshd
    - tensin.infra.firewall
    - tensin.infra.journald
    - tensin.infra.linux_status
    - tensin.infra.docker
    - tensin.infra.digitalocean_volume
    - role: tensin.infra.systemd_requires_mounts_for
      vars:
        service_name: docker
        mount_dir: '{{ volume_dir }}'
    - tensin.infra.letsencrypt
    - tensin.infra.wireguard
    - tensin.infra.my_workspace
    - tensin.infra.my_dotfiles

  vars_files:
    - ../common.yml
    - ./wg.yml

  vars:
    firewall_ports_tcp:
      # Gitea's SSH server
      - 22
      # The web server
      - 80
      - 443

    linux_status_disable_power_management: true

    volume_name: web-data
    volume_dir: /mnt/data

    letsencrypt_domains:
      - name: egort.name
        domains:
          - egort.name
          - dev.egort.name
          - git.egort.name
          - id.egort.name
          - shadow.egort.name
          - stash.egort.name

    workspace_projects:
      - url: 'ssh://git@bitbucket.org/egor-tensin/server-tensin-web.git'
        name: server
