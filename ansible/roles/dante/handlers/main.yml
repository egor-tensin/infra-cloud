# Don't restart if it's not running.
- name: Collect service facts
  ansible.builtin.service_facts:
  listen: dante_configured

- name: Restart Dante service
  become: true
  when: |
    'danted.service' in ansible_facts.services and ansible_facts.services['danted.service'].state == 'running'
  ansible.builtin.systemd_service:
    name: danted
    state: restarted
  listen: dante_configured
