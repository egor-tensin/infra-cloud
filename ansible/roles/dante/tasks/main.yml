- name: Configure Dante
  become: true
  block:
    - name: Create /etc/danted.conf
      ansible.builtin.template:
        src: danted.conf.j2
        dest: /etc/danted.conf
        owner: root
        group: root
        mode: '644'
      notify: dante_restart

- name: Install Dante
  become: true
  ansible.builtin.apt:
    name: dante-server
    state: present
    install_recommends: false
    policy_rc_d: 101
  notify: dante_restart

- name: Restart systemd service if necessary
  ansible.builtin.meta: flush_handlers
