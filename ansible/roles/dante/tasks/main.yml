- name: Create /etc/danted.conf
  become: true
  ansible.builtin.template:
    src: danted.conf.j2
    dest: /etc/danted.conf
    owner: root
    group: root
    mode: '0644'
  notify: dante_configured

- name: Restart Dante service if necessary
  ansible.builtin.meta: flush_handlers

- name: Install Dante
  become: true
  ansible.builtin.package:
    name: dante-server
    state: present

- name: Enable & start Dante service
  become: true
  ansible.builtin.systemd_service:
    name: danted
    enabled: true
    state: started
