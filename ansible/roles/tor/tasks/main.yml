- name: Get host distro
  ansible.builtin.setup:
    gather_subset:
      - distribution
      - distribution_release

- name: Configure repository
  become: true
  ansible.builtin.deb822_repository:
    name: tor
    uris: https://deb.torproject.org/torproject.org
    state: present
    signed_by: https://deb.torproject.org/torproject.org/A3C4F0F979CAA22CDBA8F512EE8CBC9E886DDD89.asc
    suites: "{{ ansible_facts['distribution_release'] | lower }}"
    components: main
  register: repo

- name: Update apt cache
  when: repo is changed
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Configure Tor
  become: true
  tensin.infra.template:
    src: torrc.j2
    dest: /etc/tor/torrc
    owner: root
    group: root
    mode: '0644'
  notify: tor_configured

- name: Configure systemd service
  become: true
  tensin.infra.template:
    src: override.conf.j2
    dest: /etc/systemd/system/tor@default.service.d/data_dir.conf
    owner: root
    group: root
    mode: '0644'
  notify: tor_configured

- name: Restart Tor service if necessary
  ansible.builtin.meta: flush_handlers

- name: Install Tor
  become: true
  ansible.builtin.package:
    name: tor
    state: present

- name: Fix permissions on data directory
  become: true
  ansible.builtin.file:
    path: '{{ tor_data_dir }}'
    state: directory
    recurse: true
    owner: debian-tor
    group: debian-tor
  notify: tor_configured

- name: Restart Tor service if necessary
  ansible.builtin.meta: flush_handlers

- name: Enable & start Tor service
  become: true
  ansible.builtin.systemd_service:
    name: tor@default
    enabled: true
    state: started
