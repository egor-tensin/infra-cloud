- block:
    - name: Clone dnscrypt-proxy repository
      ansible.builtin.git:
        accept_hostkey: true
        dest: /tmp/dnscrypt-proxy
        repo: https://github.com/DNSCrypt/dnscrypt-proxy.git

    - name: Update blocklist.txt
      ansible.builtin.command:
        cmd: ./generate-domains-blocklist.py -o /tmp/blocklist.txt
        chdir: /tmp/dnscrypt-proxy/utils/generate-domains-blocklist

    - name: Copy blocklist.txt to /etc
      become: true
      ansible.builtin.copy:
        src: /tmp/blocklist.txt
        remote_src: true
        dest: /etc/dnscrypt-proxy/blocklist.txt
        mode: '644'
        owner: root
        group: root
      notify: dnscrypt_proxy_configured

  always:
    - name: Clean up temporary files
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /tmp/dnscrypt-proxy
        - /tmp/blocklist.txt
