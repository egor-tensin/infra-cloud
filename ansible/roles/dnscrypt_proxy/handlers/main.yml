- name: Collect service facts
  ansible.builtin.service_facts:
  listen: dnscrypt_proxy_configured

- name: Restart dnscrypt-proxy service
  become: true
  when: |
    'dnscrypt-proxy.service' in ansible_facts.services and ansible_facts.services['dnscrypt-proxy.service'].state == 'running'
  ansible.builtin.systemd_service:
    name: dnscrypt-proxy
    state: restarted
  listen: dnscrypt_proxy_configured
