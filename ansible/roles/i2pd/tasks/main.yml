- name: Get host distro
  ansible.builtin.setup:
    gather_subset:
      - distribution
      - distribution_release

- name: Configure repository
  become: true
  ansible.builtin.deb822_repository:
    # Lookie here: https://repo.i2pd.xyz/.help/readme.html
    name: i2pd
    uris: "https://repo.i2pd.xyz/{{ ansible_facts['distribution'] | lower }}"
    state: present
    signed_by: https://repo.i2pd.xyz/r4sas.gpg
    suites: "{{ ansible_facts['distribution_release'] | lower }}"
    components: main
  register: repo

- name: Update apt cache
  when: repo is changed
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Configure i2pd
  become: true
  tensin.infra.template:
    src: i2pd.conf.j2
    dest: /etc/i2pd/i2pd.conf
    owner: root
    group: root
    mode: '0644'
  notify: i2pd_configured

- name: Restart i2pd service if necessary
  ansible.builtin.meta: flush_handlers

- name: Install i2pd
  become: true
  ansible.builtin.package:
    name: i2pd
    state: present

- name: Enable & start i2pd service
  become: true
  ansible.builtin.systemd_service:
    name: i2pd
    enabled: true
    state: started
