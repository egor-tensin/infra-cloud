# Don't restart if it's not running.
- name: Collect service facts
  listen: i2pd_configured
  ansible.builtin.service_facts:

- name: Restart i2pd service
  listen: i2pd_configured
  when: |
    'i2pd.service' in ansible_facts.services
    and ansible_facts.services['i2pd.service'].state == 'running'
  become: true
  ansible.builtin.systemd_service:
    name: i2pd
    state: restarted
