[defaults]
inventory = inventory
vault_password_file = scripts/vault_pass.sh

# Prettier output.
callback_result_format = yaml

# Shut up already.
interpreter_python = auto_silent
display_skipped_hosts = false
host_key_checking = false

# This setting is experimental; the docs warn that it might clash with sudo.
pipelining = true

[ssh_connection]
retries = 2
ssh_extra_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ForwardAgent=yes
