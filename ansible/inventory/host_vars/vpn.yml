firewall_ports4_tcp:
  # server-tensin-vpn
  - port: 80
    source: '{{ wireguard_addr4 }}'
  # wg-api-web
  - port: 1234
    source: 192.168.177.1/24
  # Dante
  - port: '{{ dante_port }}'
    source: '{{ wireguard_addr4 }}'
  # i2pd
  - port: '{{ i2pd_port_console }}'
    source: '{{ wireguard_addr4 }}'
  - port: '{{ i2pd_port_http_proxy }}'
    source: '{{ wireguard_addr4 }}'
  - port: '{{ i2pd_port_socks_proxy }}'
    source: '{{ wireguard_addr4 }}'
  # Tor
  - port: '{{ tor_port_socks_proxy }}'
    source: '{{ wireguard_addr4 }}'
firewall_ports_tcp:
  # i2pd
  - '{{ i2pd_port }}'
  # Tor
  - '{{ tor_port_dir }}'
  - '{{ tor_port_or }}'
firewall_ports_udp:
  # WireGuard
  - '{{ wireguard_listen_port }}'

digitalocean_volume_name: vpn-data
digitalocean_volume_dir: /mnt/data
digitalocean_volume_dependent_services:
  - tor@default

tor_nickname: '{{ vpn.tor.nickname }}'
tor_email: '{{ vpn.tor.email }}'
tor_data_dir: '{{ digitalocean_volume_dir }}/tor'

my_workspace_projects:
  - url: 'ssh://git@bitbucket.org/egor-tensin/server-tensin-vpn.git'
    name: server

wireguard_private_key: '{{ vpn.wg.private_key }}'
wireguard_addr4: '{{ wireguard_prefix4 }}.254/24'
wireguard_addr6: '{{ wireguard_prefix6 }}.254/48'
wireguard_server: true

