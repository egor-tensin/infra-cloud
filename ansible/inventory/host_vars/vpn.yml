firewall_ports4_tcp:
  # server-tensin-vpn
  - port: 80
    source: '{{ wg_addr4 }}'
  # wg-api-web
  - port: 1234
    source: 192.168.177.1/24
  # Dante
  - port: '{{ dante_port }}'
    source: '{{ wg_addr4 }}'
  # i2pd
  - port: '{{ i2pd_port_console }}'
    source: '{{ wg_addr4 }}'
  - port: '{{ i2pd_port_http_proxy }}'
    source: '{{ wg_addr4 }}'
  - port: '{{ i2pd_port_socks_proxy }}'
    source: '{{ wg_addr4 }}'
  # Tor
  - port: '{{ tor_port_socks_proxy }}'
    source: '{{ wg_addr4 }}'
firewall_ports_tcp:
  # i2pd
  - '{{ i2pd_port }}'
  # Tor
  - '{{ tor_port_dir }}'
  - '{{ tor_port_or }}'
firewall_ports_udp:
  # WireGuard
  - '{{ wg_listen_port }}'

digitalocean_volume_name: vpn-data
digitalocean_volume_dir: /mnt/data

tor_nickname: justiceforall
tor_data_dir: '{{ digitalocean_volume_dir }}/tor'

systemd_depend_mount_items:
  - dir: '{{ digitalocean_volume_dir }}'
    services: ['tor@default']
systemd_depend_iface_items:
  - name: '{{ wg_name }}'
    services: [danted, i2pd, 'tor@default']

my_workspace_projects:
  - url: 'ssh://git@bitbucket.org/egor-tensin/server-tensin-vpn.git'
    name: server

