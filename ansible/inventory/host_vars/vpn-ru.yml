firewall_ports4_tcp:
  # server-tensin-vpn-ru
  - port: 80
    source: '{{ wireguard_addr4 }}'
  # wg-api-web
  - port: 1234
    source: 192.168.177.1/24
  # Dante
  - port: '{{ dante_port }}'
    source: '{{ wireguard_addr4 }}'
firewall_ports_udp:
  # WireGuard
  - '{{ wireguard_listen_port }}'

my_workspace_projects:
  - url: 'ssh://git@altssh.bitbucket.org:443/egor-tensin/server-tensin-vpn-ru.git'
    name: server

wireguard_private_key: '{{ vpn_ru.wg.private_key }}'
wireguard_addr4: '{{ wireguard_prefix4 }}.253/24'
wireguard_addr6: '{{ wireguard_prefix6 }}.253/48'
wireguard_server: true

wireguard_peers:
  # tensin-vpn
  - public_key: hMKs36wq+gnp6fVIIgGRVL42q78+Rnj/3RCEWGA69Bs=
    preshared_key: '{{ vpn_ru.wg.psk.vpn }}'
    allowed_ips: ['{{ wireguard_addr4 }}', '{{ wireguard_addr6 }}']
    endpoint: vpn.tensin.name:443
    persistent_keepalive: true
  # tensin-laptop2
  - public_key: qLmfXqkSf+S4fU3n1GRU1nkuYCnQXcZb1ebAru/4C2U=
    preshared_key: '{{ vpn_ru.wg.psk.laptop2 }}'
    allowed_ips: ['{{ wireguard_prefix4 }}.2/32', '{{ wireguard_prefix6 }}.2/128']
  # tensin-phone3
  - public_key: SUwBB3GKMhz9lRvO2Cp2qaIW11cZ/38cb25NQ6wl9x8=
    preshared_key: '{{ vpn_ru.wg.psk.phone3 }}'
    allowed_ips: ['{{ wireguard_prefix4 }}.16/32', '{{ wireguard_prefix6 }}.16/128']
  # tensin-pc2
  - public_key: xD/Gy9P78zDDxWY64n8G5Ku3zkR8B/SPgSYVCt1ekgE=
    preshared_key: '{{ vpn_ru.wg.psk.pc2 }}'
    allowed_ips: ['{{ wireguard_prefix4 }}.19/32', '{{ wireguard_prefix6 }}.19/128']
  # tensin-laptop3
  - public_key: DZM1fZ5VET/FTQj2QrRLcMxdrVnrRMBU8i5MDvI/NzI=
