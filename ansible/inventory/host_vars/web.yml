firewall_ports_tcp:
  # Gitea
  - 22
  # server-tensin-web
  - 80
  - 443
firewall_ports4_tcp:
  # wg-api-web
  - port: 1234
    source: 192.168.177.0/24
  # Anubis Prometheus metrics
  - port: 9090
    source: '{{ wireguard_addr4 }}'

digitalocean_volume_name: web-data
digitalocean_volume_dir: /mnt/data
digitalocean_volume_dependent_services:
  - docker

letsencrypt_domains:
  - name: tensin.name
    domains:
      - tensin.name
      - '*.tensin.name'
      - egort.name
      - '*.egort.name'
  - name: fucktipp.ing
  - name: russiaissuper.gay

linux_status_enable_power_management: false

my_workspace_projects:
  - url: 'ssh://git@bitbucket.org/egor-tensin/server-tensin-web.git'
    name: server
# Those are needed to run the web server check.py script:
my_workspace_dependencies:
  - python3-pytest
  - python3-requests

wireguard_private_key: '{{ web.wg.private_key }}'
wireguard_addr4: '{{ wireguard_prefix4 }}.8/24'
wireguard_addr6: '{{ wireguard_prefix6 }}.8/48'
wireguard_peers:
  - public_key: hMKs36wq+gnp6fVIIgGRVL42q78+Rnj/3RCEWGA69Bs=
    preshared_key: '{{ web.wg.psk.vpn }}'
    allowed_ips: ['{{ wireguard_prefix4 }}.0/24', '{{ wireguard_prefix6 }}.0/48']
    endpoint: vpn.tensin.name:443
    persistent_keepalive: true
