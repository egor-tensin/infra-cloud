{{ ansible_managed | comment }}

[Unit]
RequiresMountsFor={{ volume_dir }}

# Tor binds to the WireGuard interface for SOCKS.
BindsTo=sys-devices-virtual-net-{{ wg_name }}.device
After=sys-devices-virtual-net-{{ wg_name }}.device

[Service]
# Tor authors went to far in hardening the systemd service definition IMO;
# I could barely make it work with a custom DataDirectory:
# https://github.com/raspiblitz/raspiblitz/issues/2531

ReadWritePaths={{ volume_dir }}/tor
AppArmorProfile=
