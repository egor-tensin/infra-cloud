log = syslog
loglevel = warning

port = {{ i2pd_port }}

ipv4 = true
ipv6 = false

bandwidth = X

[http]
enabled = true
address = {{ wg_addr4 | regex_replace('/\d+$', '') }}
port = {{ i2pd_port_console }}
webroot = /i2p/

[httpproxy]
enabled = true
address = {{ wg_addr4 | regex_replace('/\d+$', '') }}
port = {{ i2pd_port_http_proxy }}

[socksproxy]
enabled = true
address = {{ wg_addr4 | regex_replace('/\d+$', '') }}
port = {{ i2pd_port_socks_proxy }}

[reseed]
verify = true
