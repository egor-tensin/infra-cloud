- name: Maintenance
  hosts: all
  gather_facts: false

  roles:
    - tensin.infra.cloud_init_wait
    - tensin.infra.apt
    - tensin.infra.sshd
    - tensin.infra.firewall
    - tensin.infra.router
    - tensin.infra.journald
    - tensin.infra.linux_status
    - tensin.infra.docker
    - tensin.infra.digitalocean_volume
    - tensin.infra.wireguard
    - tor
    - tensin.infra.my_workspace
    - tensin.infra.my_dotfiles

  vars_files:
    - ../common.yml
    - ./tor.yml
    - ./wg.yml

  vars:
    firewall_ports4_tcp:
      # The web server
      - port: 80
        source: '{{ wg_addr4 }}'
      # wg-api-web
      - port: 1234
        source: 192.168.177.1/24
      # Tor SOCKS
      - port: '{{ tor_socks_port }}'
        source: '{{ wg_addr4 }}'
    firewall_ports_tcp:
      # Tor
      - '{{ tor_dir_port }}'
      - '{{ tor_or_port }}'
    firewall_ports_udp:
      # WireGuard
      - '{{ wg_listen_port }}'

    volume_name: vpn-data
    volume_dir: /mnt/data

    workspace_projects:
      - url: 'ssh://git@bitbucket.org/egor-tensin/server-tensin-vpn.git'
        name: server
