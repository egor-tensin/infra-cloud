- name: Maintenance
  hosts: all

  roles:
    - tensin.infra.apt
    - tensin.infra.firewall
    - tensin.infra.router
    - tensin.infra.journald
    - tensin.infra.linux_status
    - tensin.infra.docker
    - tensin.infra.wireguard
    - tensin.infra.workspace

  vars_files:
    - ./wg.yml

  vars:
    firewall_ports4_tcp:
      # The web server
      - port: 80
        source: '{{ wg_addr4 }}'
    firewall_ports_udp:
      # WireGuard
      - '{{ wg_listen_port }}'

    workspace_projects:
      - url: 'ssh://git@bitbucket.org/egor-tensin/server-tensin-vpn.git'
        name: server
