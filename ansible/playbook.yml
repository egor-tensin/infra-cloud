- name: General maintenance
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.cloud_init_wait
    - tensin.infra.apt
    - tensin.infra.sshd
    - tensin.infra.firewall
    - tensin.infra.linux_status
    - tensin.infra.journald

- name: Attach volumes
  hosts: digitalocean_volume
  gather_facts: false
  roles:
    - tensin.infra.digitalocean_volume

- name: Set up WireGuard
  hosts: wireguard
  gather_facts: false
  roles:
    - tensin.infra.wireguard

- name: Set up service dependencies
  hosts: all
  gather_facts: false
  tasks:
    - name: Set up filesystem mount dependencies
      ansible.builtin.include_role:
        name: tensin.infra.systemd_depend_mount
      vars:
        systemd_depend_mount_dir: '{{ depend_mount_item.dir }}'
        systemd_depend_mount_services: '{{ depend_mount_item.services }}'
      loop: '{{ systemd_depend_mount_items }}'
      loop_control:
        loop_var: depend_mount_item

    - name: Set up network interface dependencies
      ansible.builtin.include_role:
        name: tensin.infra.systemd_depend_iface
      vars:
        systemd_depend_iface_name: '{{ depend_iface_item.name }}'
        systemd_depend_iface_services: '{{ depend_iface_item.services }}'
      loop: '{{ systemd_depend_iface_items }}'
      loop_control:
        loop_var: depend_iface_item

- name: Set up Docker
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.docker
- name: Set up Let's Encrypt certificates
  hosts: letsencrypt
  gather_facts: false
  roles:
    - tensin.infra.letsencrypt
- name: Set up proxy server
  hosts: proxy
  gather_facts: false
  roles:
    - dante
- name: Set up i2pd
  hosts: i2pd
  gather_facts: false
  roles:
    - i2pd
- name: Set up Tor
  hosts: tor
  gather_facts: false
  roles:
    - tor

- name: Update my workspace
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_workspace
    - tensin.infra.my_dotfiles
