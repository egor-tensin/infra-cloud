- name: General maintenance
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.debian_cloud_server
    - tensin.infra.wireguard

- name: Attach volumes
  hosts: digitalocean_volume
  gather_facts: false
  roles:
    - tensin.infra.digitalocean_volume

- name: Set up Docker
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.docker

- name: Set up Let's Encrypt certificates
  hosts: letsencrypt
  gather_facts: false
  roles:
    - tensin.infra.letsencrypt

- name: Set up web proxy
  hosts: web_proxy
  gather_facts: false
  roles:
    - dante

- name: Set up DNS proxy
  hosts: dns_proxy
  gather_facts: false
  roles:
    - dnscrypt_proxy

- name: Set up i2pd
  hosts: i2pd
  gather_facts: false
  roles:
    - i2pd

- name: Set up Tor
  hosts: tor
  gather_facts: false
  roles:
    - tor

- name: Update my workspace
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_workspace
    - tensin.infra.my_dotfiles
