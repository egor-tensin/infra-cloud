- name: Maintenance
  hosts: all
  gather_facts: false

  roles:
    - tensin.infra.cloud_init_wait
    - tensin.infra.apt
    - tensin.infra.sshd
    - tensin.infra.firewall
    - tensin.infra.router
    - tensin.infra.journald
    - tensin.infra.linux_status
    - tensin.infra.docker
    - tensin.infra.wireguard
    - tensin.infra.my_workspace
    - tensin.infra.my_dotfiles

  vars_files:
    - ../common.yml
    - ./vars/wg.yml

  vars:
    firewall_ports4_tcp:
      # The web server
      - port: 80
        source: '{{ wg_addr4 }}'
      # wg-api-web
      - port: 1234
        source: 192.168.177.1/24
    firewall_ports_udp:
      # WireGuard
      - '{{ wg_listen_port }}'

    # Debian 11 means Focal.
    ppa_repo: focal

    workspace_projects:
      - url: 'ssh://git@bitbucket.org/egor-tensin/server-tensin-vpn-ru.git'
        name: server
