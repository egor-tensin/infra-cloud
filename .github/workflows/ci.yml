name: CI

on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Linting
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check Python formatting
        uses: psf/black@stable
      - name: Check Terraform formatting
        uses: dflook/terraform-fmt-check@v3
      - name: Check Ansible config
        run: |
          cd ansible
          ansible-config validate --type all
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.7.1
